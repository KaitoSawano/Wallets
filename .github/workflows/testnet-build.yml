# Build a FeeSafe apk for Testnet, using the master branch.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master, test-ci-build ]
    paths:
      - 'feesafe-android/**'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    # 1 - checkout project and dependencies

    - name: Checkout FeeSafe
      uses: actions/checkout@v2
      with:
        path: feesafe

    - name: Checkout lightning-kmp
      uses: actions/checkout@v2
      with:
        repository: ACINQ/lightning-kmp
        ref: master
        path: lightning-kmp

    # 2 - setup cache/jdk

    - name: Cached Konan
      uses: actions/cache@v4
      with:
        path: ~/.konan
        key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: ${{ runner.os }}-konan-

    - name: Set up jdk 1.17
      uses: actions/setup-java@v1
      with:
        java-version: 17

    # 3 - build dependencies & app

    - name: Build lightning-kmp and install to local maven repo
      run: |
        cd lightning-kmp
        chmod +x gradlew
        ./gradlew clean build publishToMavenLocal -x check

    - name: Assemble the android apk
      run: |
        cd feesafe
        chmod +x gradlew
        ./gradlew clean
        printf "\nskip.android=false" >> local.properties
        ./gradlew :feesafe-android:assembleRelease --stacktrace

    # 4 - sign apk

    - name: Retrieve signing key
      run: 'echo "$TESTNET_KEY_HEX" | xxd -r -p > signingkey'
      shell: bash
      env:
        TESTNET_KEY_HEX: ${{secrets.TESTNET_KEY_HEX}}

    - name: Set up Java 11 for signing
      uses: actions/setup-java@v2
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Sign artifact
      run: |
        mkdir upload
        mv feesafe/feesafe-android/build/outputs/apk/release/feesafe-*.apk upload/feesafe-testnet-latest.apk
        /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign --ks "$KS_FILE" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" "$APK_FILE"
      shell: bash
      env:
        KS_FILE: signingkey
        KS_PASS: ${{ secrets.TESTNET_STORE_PASS }}
        KS_ALIAS: ${{ secrets.TESTNET_ALIAS }}
        KEY_PASS: ${{ secrets.TESTNET_KEY_PASS }}
        APK_FILE: upload/feesafe-testnet-latest.apk

    # 5 - upload apk

    - name: Upload apk as artifact for this action
      uses: actions/upload-artifact@v4
      with:
        name: feesafe-testnet
        path: upload/feesafe-testnet-latest.apk

    - name: Upload to acinq.co
      run: |
        aws s3 cp ./upload/feesafe-testnet-latest.apk s3://acinq.co/pub/feesafe/
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: 'eu-west-1'
